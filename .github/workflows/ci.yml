name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release version is derived from commit messages, so a malformed message
  # silently costs a release. This gate makes that a CI failure instead.
  commits:
    name: Semantic Commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # commitlint needs the history to resolve the range it validates.
          fetch-depth: 0

      # Validates only the commits introduced by this push/PR - the existing
      # non-conventional history is never re-checked. Rules: commitlint.config.mjs
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6

  quality:
    name: Quality (PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Laravel 10 and 11 are no longer matrix cells. Both branches are past security
        # support, so every `laravel/framework` release in them carries open advisories
        # and Composer's `policy.advisories.block` refuses to resolve them.
        #
        # Laravel 13 requires PHP ^8.3, so it has no 8.2 cell - 8.2 is covered by Laravel
        # 12 only, which is why the package keeps `^12.0 || ^13.0` rather than 13 alone.
        # Each Laravel line pairs with its own Testbench major: 12 -> 10.*, 13 -> 11.*.
        include:
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }
          - { php: '8.5', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # hradigital/php-static-analysis is a private repository, so the default
      # GITHUB_TOKEN cannot reach it. COMPOSER_TOKEN must be a PAT with read
      # access to it, stored as a repository secret.
      - name: Authenticate Composer against private repositories
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$COMPOSER_TOKEN"

      - name: Pin Laravel & Testbench for matrix cell
        run: |
          composer require --no-update --no-interaction --dev \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint PHP files
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Coding standards (phpcs)
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Static analysis (phpstan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run tests (phpunit)
        run: vendor/bin/phpunit --no-coverage
